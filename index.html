<html lang="id">

<title>Undangan Digital</title>

<style>

body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#f1ede6;color:#2b2622;line-height:1.55;font-size:15px}
button,input,textarea{font:inherit;color:inherit}

:focus-visible{outline:2px solid #2f6f5e;outline-offset:2px}

.login p{color:#6f655a;font-size:.88rem;margin-bottom:1rem}
.login .btn{width:100%;margin-top:.5rem}
.sep{margin:1.2rem 0 .6rem;font-size:.8rem;color:#6f655a}
.top{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;padding:.8rem 1rem;background:#fff;border-bottom:1px solid #e0d9ce;position:sticky;top:0;z-index:20}
.top b{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.3rem;margin-right:auto}
.vt{display:none;gap:.4rem;padding:.6rem 1rem 0}
.ed{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:1.2rem;padding:1rem;max-width:1200px;margin:auto}
.panel{background:#fff;border:1px solid #e0d9ce;border-radius:16px;padding:1.2rem}
.panel h3{font-size:.95rem;margin:1.2rem 0 .5rem;padding-top:1rem;border-top:1px solid #eee7dc}
.panel h3:first-child{margin-top:0;padding-top:0;border-top:0}
.panel label{display:block;font-size:.8rem;color:#6f655a;margin-bottom:.6rem}
.panel input[type=text],.panel input[type=url],.panel input[type=datetime-local],.panel textarea,.login input{display:block;width:100%;margin-top:.2rem;padding:.55rem .65rem;border:1px solid #d6cec3;border-radius:9px;background:#fffdfa;font-size:.9rem}
.login input{margin:.4rem 0}
.panel input[type=color]{display:block;width:60px;height:34px;border:1px solid #d6cec3;border-radius:8px;padding:2px;margin-top:.2rem}
.tabs,.sw,.row{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.tab{border:1px solid #d6cec3;background:#fff;border-radius:999px;padding:.4rem .9rem;cursor:pointer;font-size:.82rem}
.tab.on{background:#2b2622;color:#fff;border-color:#2b2622}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #cfc6ba;cursor:pointer}
.out{word-break:break-all;font-size:.75rem;background:#f6f2eb;border-radius:9px;padding:.6rem;margin-top:.5rem;max-height:90px;overflow:auto}
.gl{margin-top:.6rem;display:grid;gap:.4rem}
.gl div{display:flex;gap:.4rem;align-items:center;justify-content:space-between;background:#f6f2eb;border-radius:9px;padding:.4rem .6rem;font-size:.85rem}
.pv{position:sticky;top:64px;align-self:start}
.phone{height:80vh;overflow:auto;border:1px solid #d6cec3;border-radius:20px;background:#fff}
.hint{font-size:.76rem;color:#7a6f64;margin-top:.3rem}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b2622;color:#fff;padding:.6rem 1rem;border-radius:10px;font-size:.85rem;z-index:99}
.err{max-width:420px;margin:20vh auto;text-align:center;padding:1.5rem}

/* ===== Undangan ===== */

.inv section{padding:3.2rem 1.6rem;text-align:center}

.inv .lb{font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:.8rem;color:#7a6f64}
.inv .ib{font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:.88rem}
.cover{display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:640px;background:linear-gradient(180deg,var(--t),#fffdf9);position:relative}
.gst .cover{min-height:100vh;min-height:100svh}
.cover::before{content:"";position:absolute;inset:14px;border:1px solid var(--l);pointer-events:none}
.av{width:150px;height:150px;border-radius:50%;object-fit:cover;border:5px solid #fff;box-shadow:0 0 0 1px var(--l);margin-bottom:1.2rem;background:var(--t)}
.nm{font-size:clamp(2.6rem,13vw,3.8rem);line-height:1.05;color:var(--c);font-weight:700;margin:.3rem 0 .6rem;animation:rise .9s ease both}
.gb{margin:1.4rem 0;padding:.9rem 1.2rem;background:#fff;border:1px solid var(--l);border-radius:14px;font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:.85rem}
.gb b{display:block;font-size:1.05rem;margin-top:.2rem}
.ib-btn{border:0;background:var(--c);color:#fff;padding:.8rem 1.6rem;border-radius:999px;cursor:pointer;font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-weight:600;font-size:.9rem;text-decoration:none;display:inline-block}
.ib-btn.o{background:#fff;color:var(--c);border:1px solid var(--c)}
.box{background:#fff;border:1px solid var(--l);border-radius:14px;padding:1.1rem;margin-top:1rem}
.q{font-style:italic;color:#5b5047;margin-top:1.2rem}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-top:1rem}
.cd div{background:var(--t);border-radius:12px;padding:.8rem .2rem}
.cd b{display:block;font-size:2rem;color:var(--c);line-height:1}
.cd span{font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:.7rem;color:#7a6f64}
.alt{background:var(--t)}
.wl{max-height:300px;overflow:auto;text-align:left;margin-top:1rem}
.w{background:#fff;border:1px solid var(--l);border-radius:12px;padding:.7rem .9rem;margin-bottom:.5rem;font-size:1rem}
.w span{font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:.7rem;color:#8a7f73;margin-left:.5rem}
.inv input,.inv textarea{display:block;width:100%;margin-top:.5rem;padding:.65rem .8rem;border:1px solid var(--l);border-radius:10px;font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:.88rem;background:#fff}
.inv footer{padding:2rem 1rem 3rem;text-align:center;color:#8a7f73;font-size:.9rem}
[data-t=ultah] .nm{font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-weight:600;letter-spacing:-.02em}
[data-t=ultah] .cover{background:radial-gradient(circle at 12% 18%,var(--l) 0 6px,transparent 7px),radial-gradient(circle at 88% 30%,var(--l) 0 9px,transparent 10px),radial-gradient(circle at 20% 82%,var(--l) 0 8px,transparent 9px),radial-gradient(circle at 82% 88%,var(--l) 0 5px,transparent 6px),linear-gradient(180deg,var(--t),#fffdf9)}
[data-t=ultah] .cover::before{border-radius:28px}
[data-t=khitan] .cover::after{content:"";position:absolute;left:14px;right:14px;top:14px;height:14px;background:repeating-linear-gradient(45deg,var(--l) 0 8px,transparent 8px 16px)}
[data-t=nikah] .nm{font-style:italic}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.nm{animation:none}html{scroll-behavior:auto}}
</style>
</head>

    if (isNaN(t) || df <= 0) { ['d', 'h', 'm', 's'].forEach(function (k) { $('cd-' + k).textContent = '0'; }); g.textContent = isNaN(t) ? 'Tanggal acara belum diisi' : 'Acara sudah dimulai atau telah berlangsung'; return; }
    g.textContent = '';
    $('cd-d').textContent = Math.floor(df / 864e5); $('cd-h').textContent = pad(Math.floor(df % 864e5 / 36e5));
    $('cd-m').textContent = pad(Math.floor(df % 36e5 / 6e4)); $('cd-s').textContent = pad(Math.floor(df % 6e4 / 1e3));
  }
  run(); tick = setInterval(run, 1000);
}
function renderPreview() {
  var p = $('pv'); if (!p) return; var top = p.scrollTop;
  p.innerHTML = invite(PG); p.scrollTop = top; startTick();
}
/* ===== Halaman ===== */
function renderLogin() {

    '<div class="sep">Atau masuk dengan kode akses atau akun</div>' +

    '<button class="btn l" data-act="login">Masuk</button><p class="hint" style="margin-top:.8rem">Kode demo: NIKAH2026, ULTAH2026, KHITAN2026</p></div>';
}
function doLogin(t) {
  var sv = load(); S = (sv && sv.type === t) ? sv : preset(t); PG = S.pg || '';
  try { localStorage.setItem(LKEY, '1'); } catch (x) {}

}
function F(k, label, type, ph) { return '<label>' + label + '<input data-k="' + k + '" type="' + (type || 'text') + '" value="' + e(S[k]) + '" placeholder="' + e(ph || '') + '"></label>'; }
function T(k, label, rows) { return '<label>' + label + '<textarea data-k="' + k + '" rows="' + (rows || 3) + '">' + e(S[k]) + '</textarea></label>'; }
function formHTML() {

    '<h3>Informasi acara</h3>' + F('title', 'Judul acara') + F('n1', l.n1) + F('n2', l.n2) + F('p1', l.p1) + F('p2', l.p2) +
    F('date', 'Tanggal dan jam acara', 'datetime-local') + F('note', 'Rangkaian acara', 'text', 'Contoh: Akad 08.00 · Resepsi 11.00') +
    F('venue', 'Nama tempat') + T('addr', 'Alamat lengkap', 2) + F('maps', 'Link Google Maps', 'url', 'https://maps.google.com/...') +
    T('intro', 'Ucapan pembuka', 4) + T('quote', 'Kutipan atau doa', 3) +
    '<h3>Tampilan</h3><label>Warna tema utama<input data-k="color" type="color" value="' + safeColor(S.color) + '"></label><div class="sw">' + SWATCH.map(function (c) { return '<span class="dot" tabindex="0" role="button" aria-label="Warna ' + c + '" style="background:' + c + '" data-act="color" data-v="' + c + '"></span>'; }).join('') + '</div>' +
    '<h3>Foto</h3><label>Upload foto (otomatis diperkecil di bawah 50KB)<input id="ph" type="file" accept="image/*"></label>' + F('photoUrl', 'Atau URL gambar (membuat link lebih pendek)', 'url', 'https://...') +
    '<div class="row"><span class="hint" id="phs">' + cur + '</span><button class="btn l s" data-act="delphoto">Hapus foto</button></div>' +
    '<h3>Amplop digital</h3><label style="display:flex;gap:.5rem;align-items:center"><input type="checkbox" id="sb" ' + (S.showBank !== false ? 'checked' : '') + ' style="width:auto;margin:0"> Tampilkan di undangan</label>' +
    F('bk1', 'Bank / e-wallet 1', 'text', 'BCA / DANA / OVO') + F('bn1', 'Atas nama 1') + F('ba1', 'Nomor rekening 1') + F('bk2', 'Bank / e-wallet 2') + F('bn2', 'Atas nama 2') + F('ba2', 'Nomor rekening 2') +
    '<h3>Nama tamu</h3>' + F('pg', 'Nama tamu untuk pratinjau', 'text', 'Contoh: Bapak Andi') +
    '<label>Daftar tamu (1 baris = 1 nama)<textarea id="gt" rows="5" placeholder="Bapak Andi&#10;Ibu Sinta&#10;Keluarga Hartono"></textarea></label><button class="btn" data-act="guests">Buat daftar Salin Link WA</button><div class="gl" id="gl"></div>' +

    '<div id="go"></div><p class="hint">Perubahan tersimpan otomatis di browser ini. Bagikan hanya link hasil Generate agar tamu melihat data terbaru.</p>';
}
function renderEditor() {
  document.body.className = ''; document.title = 'Editor Undangan';
  $('app').innerHTML = '<div class="top"><b>Editor Undangan</b><button class="btn l s" data-act="logout">Keluar</button></div>' +
    '<div class="vt"><button class="tab on" data-act="view" data-v="edit">Edit</button><button class="tab" data-act="view" data-v="pv">Pratinjau</button></div>' +
    '<div class="ed" id="ed" data-v="edit"><aside class="panel" id="form">' + formHTML() + '</aside><main class="pv"><div class="phone" id="pv"></div></main></div>';
  renderPreview();

function renderGuest(to) {
  S = merge(S); document.body.className = 'gst'; document.title = S.title;
  $('app').innerHTML = invite(to || ''); startTick();
}
/* ===== Aksi ===== */
function resize(file, cb) {
  var r = new FileReader();
  r.onerror = function () { toast('File tidak bisa dibaca'); };
  r.onload = function () {
    var im = new Image();
    im.onerror = function () { toast('File bukan gambar yang valid'); };
    im.onload = function () {
      var q = .72, sc = Math.min(1, 360 / Math.max(im.width, im.height)), w = Math.max(1, Math.round(im.width * sc)), h = Math.max(1, Math.round(im.height * sc)), cv = document.createElement('canvas'), out = '';
      for (var i = 0; i < 14; i++) {
        cv.width = w; cv.height = h; var x = cv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(im, 0, 0, w, h);
        out = cv.toDataURL('image/jpeg', q); if (out.length * .75 < 50000) break;
        q = Math.max(.4, q - .08); w = Math.max(1, Math.round(w * .85)); h = Math.max(1, Math.round(h * .85));
      }
      cb(out);
    };
    im.src = r.result;
  };
  r.readAsDataURL(file);
}
function changeType(t) {
  if (t === S.type) return;
  if (!confirm('Mengganti jenis acara akan memuat contoh data baru dan mengganti isi form. Lanjutkan?')) return;
  S = preset(t); PG = ''; save(); $('form').innerHTML = formHTML(); renderPreview();
}
function sendWish() {
  var n = $('wn').value.trim(), m = $('wm').value.trim();
  if (!n || !m) { toast('Isi nama dan ucapan dahulu'); return; }
  var a = wishes(); a.unshift({ n: n.slice(0, 40), m: m.slice(0, 300), t: new Date().toLocaleString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) });
  try { localStorage.setItem(wishKey(), JSON.stringify(a.slice(0, 100))); } catch (x) {}
  $('wl').innerHTML = wishHTML(); $('wn').value = ''; $('wm').value = ''; toast('Ucapan terkirim');
}
function act(a, el) {
  var v = el.getAttribute('data-v');
  if (a === 'open') { var t = $('isi'); if (t) t.scrollIntoView({ behavior: 'smooth' }); }
  else if (a === 'wish') sendWish();
  else if (a === 'share-copy') copy(waText(PG || (new URLSearchParams(location.search)).get('to') || ''), 'Teks undangan tersalin');
  else if (a === 'demo') doLogin(v);
  else if (a === 'login') {
    var c = ($('lc').value || '').trim().toUpperCase(), em = ($('le').value || '').trim().toLowerCase(), pw = $('lp').value;
    if (CODES[c]) doLogin(CODES[c]);
    else if (em === 'demo@undangan.id' && pw === 'demo123') doLogin((load() || preset('nikah')).type);
    else toast('Kode atau akun tidak cocok');
  }
  else if (a === 'logout') { try { localStorage.removeItem(LKEY); } catch (x) {} renderLogin(); }
  else if (a === 'view') { $('ed').setAttribute('data-v', v); document.querySelectorAll('.vt .tab').forEach(function (b) { b.classList.toggle('on', b === el); }); }
  else if (a === 'type') changeType(v);
  else if (a === 'color') { S.color = v; save(); document.querySelector('[data-k=color]').value = v; renderPreview(); }
  else if (a === 'delphoto') { S.photo = ''; S.photoUrl = ''; save(); $('form').innerHTML = formHTML(); renderPreview(); }
  else if (a === 'gen') {
    var u = guestLink(PG), g = $('go');
    g.innerHTML = '<div class="out" id="gu">' + e(u) + '</div><div class="row" style="margin-top:.5rem"><button class="btn s" data-copy="' + e(u) + '">Salin link</button><a class="btn l s" target="_blank" rel="noopener" href="' + e(u) + '">Uji di tab baru</a></div><p class="hint">Panjang link: ' + u.length + ' karakter.' + (u.length > 6000 ? ' Link cukup panjang. Pakai URL gambar agar lebih pendek.' : '') + '</p>';
  }
  else if (a === 'guests') {
    var seen = {}, names = ($('gt').value || '').split('\n').map(function (x) { return x.trim(); }).filter(function (x) { if (!x || seen[x]) return false; seen[x] = 1; return true; }).slice(0, 300);
    GL = names.map(function (n) { return waText(n); });
    $('gl').innerHTML = names.length ? names.map(function (n, i) { return '<div><span>' + e(n) + '</span><span><button class="btn s" data-act="gcopy" data-v="' + i + '">Salin Link WA</button></span></div>'; }).join('') : '<p class="hint">Isi minimal satu nama.</p>';
  }
  else if (a === 'gcopy') copy(GL[+v] || '', 'Pesan WA tersalin');
  else if (a === 'export') {
    var b = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' }), l = document.createElement('a');
    l.href = URL.createObjectURL(b); l.download = 'undangan-' + S.type + '.json'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(function () { URL.revokeObjectURL(l.href); }, 500);
  }
  else if (a === 'reset') { if (confirm('Kembalikan semua isi ke contoh awal?')) { S = preset(S.type); PG = ''; save(); $('form').innerHTML = formHTML(); renderPreview(); toast('Data direset'); } }
}
document.addEventListener('click', function (ev) {
  var c = ev.target.closest ? ev.target.closest('[data-copy]') : null;
  if (c) { copy(c.getAttribute('data-copy'), 'Tersalin'); return; }
  var el = ev.target.closest ? ev.target.closest('[data-act]') : null;
  if (el) act(el.getAttribute('data-act'), el);
});
document.addEventListener('keydown', function (ev) {
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.classList && ev.target.classList.contains('dot')) { ev.preventDefault(); ev.target.click(); }
});
document.addEventListener('input', function (ev) {
  var k = ev.target.getAttribute && ev.target.getAttribute('data-k');
  if (!k || !S) return;
  S[k] = ev.target.value; if (k === 'pg') PG = S.pg;
  save(); clearTimeout(timer); timer = setTimeout(renderPreview, 150);
});
document.addEventListener('change', function (ev) {
  var t = ev.target;
  if (t.id === 'sb') { S.showBank = t.checked; save(); renderPreview(); }
  else if (t.id === 'ph' && t.files && t.files[0]) {
    resize(t.files[0], function (d) { S.photo = d; save(); $('phs').textContent = 'Foto upload aktif (' + Math.round(d.length * .75 / 1024) + ' KB).'; renderPreview(); });
  }
  else if (t.id === 'imp' && t.files && t.files[0]) {
    var r = new FileReader();
    r.onload = function () {
      try { var o = JSON.parse(r.result); if (!o || typeof o !== 'object') throw 0; S = merge(o); PG = S.pg || ''; save(); $('form').innerHTML = formHTML(); renderPreview(); toast('Import berhasil'); }
      catch (x) { toast('File JSON tidak valid'); }
    };
    r.readAsText(t.files[0]); t.value = '';
  }
});
/* ===== Mulai ===== */
function boot() {
  var q = new URLSearchParams(location.search), data = q.get('data');
  if (data) {
    var o = dec(data);
    if (o) { S = o; renderGuest(q.get('to')); }
    else { document.body.className = ''; $('app').innerHTML = '<div class="err"><h2>Undangan tidak bisa dibuka</h2><p>Link rusak atau terpotong. Mintalah pengirim membagikan ulang link undangan.</p></div>'; }
    return;
  }
  var sv = load(), logged = false;
  try { logged = localStorage.getItem(LKEY) === '1'; } catch (x) {}
  if (logged && sv) { S = sv; PG = S.pg || ''; renderEditor(); } else renderLogin();
}
try { boot(); } catch (x) { $('app').innerHTML = '<div class="err"><h2>Terjadi kesalahan</h2><p>Muat ulang halaman. Jika masih gagal, hapus data situs di browser.</p></div>'; }
})();
</script>
